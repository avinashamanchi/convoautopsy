name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            server/ai-proxy/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Test web
        run: npm test

      - name: Lint web
        run: npm run lint

      - name: Build web
        env:
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
        run: npm run build

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Test mobile
        run: npm test
        working-directory: mobile

      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: mobile

      - name: Lint mobile
        run: npm run lint
        working-directory: mobile

      - name: Export iOS bundle
        run: npm run export:ios
        working-directory: mobile

      - name: Install Worker dependencies
        run: npm ci
        working-directory: server/ai-proxy

      - name: Test Worker
        run: npm test
        working-directory: server/ai-proxy

      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: server/ai-proxy

      - name: Lint Worker
        run: npm run lint
        working-directory: server/ai-proxy

      - name: Build Worker bundle
        run: npm run build
        working-directory: server/ai-proxy

      - name: Scan tracked tree and built bundles for secrets
        run: npm run scan:secrets

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
