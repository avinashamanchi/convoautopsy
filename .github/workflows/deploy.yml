name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            server/ai-proxy/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Test web
        run: npm test

      - name: Lint web
        run: npm run lint

      - name: Audit web
        run: npm audit --audit-level=high

      - name: Build web
        env:
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
        run: npm run build

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Test mobile
        run: npm test
        working-directory: mobile

      - name: Typecheck mobile
        run: npm run typecheck
        working-directory: mobile

      - name: Lint mobile
        run: npm run lint
        working-directory: mobile

      - name: Check Expo project health
        run: npm run expo:doctor
        working-directory: mobile

      - name: Export iOS bundle
        run: npm run export:ios
        working-directory: mobile

      - name: Audit mobile
        run: node scripts/check-mobile-audit.mjs

      - name: Install Worker dependencies
        run: npm ci
        working-directory: server/ai-proxy

      - name: Test Worker
        run: npm test
        working-directory: server/ai-proxy

      - name: Typecheck Worker
        run: npm run typecheck
        working-directory: server/ai-proxy

      - name: Lint Worker
        run: npm run lint
        working-directory: server/ai-proxy

      - name: Build Worker bundle
        run: npm run build
        working-directory: server/ai-proxy

      - name: Build Worker load fixture
        run: npx wrangler deploy --dry-run --config wrangler.load.jsonc --outdir dist-load
        working-directory: server/ai-proxy

      - name: Run short Worker load gate
        run: npm run test:load:ci
        working-directory: server/ai-proxy

      - name: Audit Worker
        run: npm audit --audit-level=high
        working-directory: server/ai-proxy

      - name: Scan tracked tree and built bundles for secrets
        run: npm run scan:secrets

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
