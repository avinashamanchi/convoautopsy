name: ConvoAutopsy Release Readiness (No Deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            server/ai-proxy/package-lock.json

      - name: Web gates
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Mobile gates
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run expo:doctor
          npm run export:ios
          node ../scripts/check-mobile-audit.mjs

      - name: Worker gates and credential-free dry run
        working-directory: server/ai-proxy
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npx wrangler deploy --dry-run --config wrangler.load.jsonc --outdir dist-load
          npm audit --omit=dev --audit-level=high

      - name: Full local provider-stub capacity and cost gate
        timeout-minutes: 90
        working-directory: server/ai-proxy
        run: npm run test:load -- --sustained-seconds 3600 --burst-seconds 300

      - name: Redacted tracked-tree and bundle scan
        run: node scripts/scan-secrets.mjs --tracked --paths dist mobile/dist server/ai-proxy/dist server/ai-proxy/dist-load

      - name: Create content-free evidence
        run: |
          mkdir -p release-evidence
          node -e 'require("node:fs").writeFileSync("release-evidence/result.txt", `sha=${process.env.GITHUB_SHA}\nstatus=local-gates-passed\ndeployed=false\nsubmitted=false\n`)'

      - uses: actions/upload-artifact@v4
        with:
          name: convoautopsy-release-readiness-${{ github.sha }}
          path: release-evidence/result.txt
          if-no-files-found: error
          retention-days: 14
