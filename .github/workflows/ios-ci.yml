name: ConvoAutopsy CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run expo:doctor
        working-directory: mobile
      - run: npm run export:ios
        working-directory: mobile
      - run: npm audit --audit-level=high
        working-directory: mobile

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/ai-proxy/package-lock.json
      - run: npm ci
        working-directory: server/ai-proxy
      - run: npm test
        working-directory: server/ai-proxy
      - run: npm run typecheck
        working-directory: server/ai-proxy
      - run: npm run lint
        working-directory: server/ai-proxy
      - run: npm run build
        working-directory: server/ai-proxy
      - run: npm audit --audit-level=high
        working-directory: server/ai-proxy

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run scan:secrets
      - run: npm audit --audit-level=high
